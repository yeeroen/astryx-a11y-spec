name: CI
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        # Chromium and its system libraries come with the image: no browser install. Keep the tag in
        # step with @playwright/test in package.json.
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
            options: --user 1001
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
            - run: pnpm test:chromium
